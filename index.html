<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Balanza">
<meta name="theme-color" content="#185FA5">
<title>Balanza — Presupuesto Personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #185FA5;
  --blue-light: #E6F1FB;
  --blue-mid: #378ADD;
  --green: #0F6E56;
  --green-light: #E1F5EE;
  --amber: #854F0B;
  --amber-light: #FAEEDA;
  --amber-mid: #EF9F27;
  --red: #A32D2D;
  --red-light: #FCEBEB;
  --purple: #3C3489;
  --purple-light: #EEEDFE;
  --gray: #5F5E5A;
  --gray-light: #F1EFE8;
  --text: #1a1a1a;
  --text-secondary: #6b6b6b;
  --bg: #f5f4f0;
  --surface: #ffffff;
  --border: rgba(0,0,0,0.1);
  --border-strong: rgba(0,0,0,0.2);
  --radius: 12px;
  --radius-sm: 8px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --text: #f0ede8;
    --text-secondary: #a0a09a;
    --bg: #1a1917;
    --surface: #242320;
    --border: rgba(255,255,255,0.1);
    --border-strong: rgba(255,255,255,0.2);
    --blue-light: #0c2d4a;
    --green-light: #062e22;
    --amber-light: #3a2005;
    --red-light: #3a1010;
    --purple-light: #1a1640;
    --gray-light: #2a2927;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:480px;margin:0 auto;padding-bottom:80px}
input,select,button{font-family:'DM Sans',sans-serif;font-size:16px}

/* NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:0.5px solid var(--border);display:flex;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:100}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;background:none;border:none;cursor:pointer;color:var(--text-secondary);font-size:10px;font-weight:500;transition:color .15s}
.bnav-btn.active{color:var(--blue)}
.bnav-btn i{font-size:22px}

/* SCREENS */
.screen{display:none;padding:0 16px;animation:fadeIn .15s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* HEADER */
.app-header{padding:16px 16px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.app-logo{display:flex;align-items:center;gap:8px}
.app-logo-icon{width:34px;height:34px;background:var(--blue);border-radius:9px;display:flex;align-items:center;justify-content:center}
.app-logo-icon svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app-title{font-size:20px;font-weight:500;color:var(--text)}
.app-mes{font-size:12px;color:var(--text-secondary)}

/* HERO CARD */
.hero-card{border-radius:var(--radius);padding:20px;margin:12px 0;color:#fff}
.hero-label{font-size:12px;opacity:.8;margin-bottom:4px}
.hero-amount{font-size:36px;font-weight:500;letter-spacing:-1px;line-height:1}
.hero-sub{font-size:12px;opacity:.7;margin-top:6px}

/* METRIC GRID */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.metric{background:var(--surface);border-radius:var(--radius-sm);padding:14px;border:0.5px solid var(--border)}
.metric-lbl{font-size:11px;color:var(--text-secondary);display:flex;align-items:center;gap:4px;margin-bottom:4px}
.metric-lbl i{font-size:13px}
.metric-val{font-size:22px;font-weight:500}

/* SECTION LABEL */
.sec-lbl{font-size:11px;font-weight:500;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 8px}

/* ENTRY */
.entry-list{display:flex;flex-direction:column;gap:6px}
.entry{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;display:flex;align-items:center;gap:10px}
.entry-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.entry-body{flex:1;min-width:0}
.entry-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-meta{font-size:11px;color:var(--text-secondary);margin-top:1px}
.entry-amount{font-size:14px;font-weight:500;flex-shrink:0}
.entry-del{background:none;border:none;cursor:pointer;color:var(--text-secondary);font-size:18px;padding:4px;flex-shrink:0;opacity:.6}
.entry-del:active{opacity:1}

/* FORM */
.add-form{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:4px}
.form-title{font-size:13px;font-weight:500;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;color:var(--text-secondary)}
.field input,.field select{background:var(--bg);border:0.5px solid var(--border-strong);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-size:15px;width:100%;outline:none;-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:var(--blue)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;padding:13px;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:500;cursor:pointer;color:#fff;transition:opacity .15s}
.btn:active{opacity:.85}
.btn-blue{background:var(--blue)}
.btn-green{background:var(--green)}
.btn-amber{background:var(--amber)}

/* BUDGET ROW */
.budget-row{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:6px}
.brow-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.brow-name{font-size:13px;font-weight:500}
.brow-right{display:flex;align-items:center;gap:8px}
.brow-pct{font-size:12px;font-weight:500}
.brow-val{font-size:13px;font-weight:500}
.prog-wrap{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin-bottom:4px}
.prog-fill{height:5px;border-radius:3px;transition:width .4s ease}
.brow-sub{font-size:11px;color:var(--text-secondary)}

/* RULE CARDS */
.rule-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:6px;display:flex;gap:12px;align-items:center}
.rule-pct{font-size:24px;font-weight:500;width:52px;text-align:center;flex-shrink:0}
.rule-title{font-size:14px;font-weight:500}
.rule-sub{font-size:11px;color:var(--text-secondary);margin-top:2px}

/* ALERT */
.alert{border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.alert i{font-size:16px;flex-shrink:0;margin-top:1px}

/* CHART */
.chart-wrap{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.bars{display:flex;align-items:flex-end;gap:8px;height:90px;margin-bottom:8px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.bar-rect{width:100%;border-radius:3px 3px 0 0;min-height:3px;transition:height .3s}
.bar-lbl{font-size:10px;color:var(--text-secondary);text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;gap:14px}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-secondary)}
.leg-dot{width:8px;height:8px;border-radius:50%}

/* EMPTY */
.empty{text-align:center;padding:32px 16px;color:var(--text-secondary);font-size:14px;line-height:1.6}
.empty i{font-size:36px;opacity:.3;display:block;margin-bottom:8px}

/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
</head>
<body>

<div class="app-header">
  <div class="app-logo">
    <div class="app-logo-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    </div>
    <span class="app-title">Balanza</span>
  </div>
  <span class="app-mes" id="mes-label"></span>
</div>

<div id="screen-resumen" class="screen active">
  <div class="hero-card" id="hero-card">
    <div class="hero-label">Balance del mes</div>
    <div class="hero-amount" id="hero-amount">$0</div>
    <div class="hero-sub" id="hero-sub">Agrega tus ingresos para comenzar</div>
  </div>
  <div class="metrics">
    <div class="metric">
      <div class="metric-lbl" style="color:var(--green)"><i class="ti ti-cash"></i> Ingresos</div>
      <div class="metric-val" style="color:var(--green)" id="m-ingresos">$0</div>
    </div>
    <div class="metric">
      <div class="metric-lbl" style="color:var(--red)"><i class="ti ti-credit-card"></i> Gastos</div>
      <div class="metric-val" style="color:var(--red)" id="m-gastos">$0</div>
    </div>
    <div class="metric">
      <div class="metric-lbl"><i class="ti ti-lock"></i> Fijos</div>
      <div class="metric-val" id="m-fijos">$0</div>
    </div>
    <div class="metric">
      <div class="metric-lbl"><i class="ti ti-arrows-shuffle"></i> Variables</div>
      <div class="metric-val" id="m-variables">$0</div>
    </div>
  </div>
  <div id="regla-wrap"></div>
  <div class="sec-lbl">Últimos movimientos</div>
  <div id="ultimos-wrap"></div>
</div>

<div id="screen-ingresos" class="screen">
  <div class="add-form" style="margin-top:12px">
    <div class="form-title">Nuevo ingreso</div>
    <div class="field">
      <label>Descripción</label>
      <input type="text" id="ing-desc" placeholder="Ej. Sueldo de junio...">
    </div>
    <div class="field-row">
      <div class="field" style="margin:0">
        <label>Monto (MXN)</label>
        <input type="number" id="ing-monto" placeholder="0" min="0" inputmode="decimal">
      </div>
      <div class="field" style="margin:0">
        <label>Categoría</label>
        <select id="ing-cat">
          <option>Sueldo</option>
          <option>Freelance</option>
          <option>Renta cobrada</option>
          <option>Bono</option>
          <option>Negocio</option>
          <option>Otro</option>
        </select>
      </div>
    </div>
    <div style="margin-top:4px">
      <button class="btn btn-green" onclick="addIngreso()">+ Agregar ingreso</button>
    </div>
  </div>
  <div class="sec-lbl">Ingresos del mes</div>
  <div id="ingresos-lista"></div>
</div>

<div id="screen-gastos" class="screen">
  <div class="add-form" style="margin-top:12px">
    <div class="form-title">Nuevo gasto</div>
    <div class="field">
      <label>Descripción</label>
      <input type="text" id="gasto-desc" placeholder="Ej. Renta, Súper, Uber...">
    </div>
    <div class="field-row">
      <div class="field" style="margin:0">
        <label>Monto (MXN)</label>
        <input type="number" id="gasto-monto" placeholder="0" min="0" inputmode="decimal">
      </div>
      <div class="field" style="margin:0">
        <label>Tipo</label>
        <select id="gasto-tipo">
          <option value="fijo">Fijo</option>
          <option value="variable">Variable</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Categoría</label>
      <select id="gasto-cat">
        <option>Renta / Hipoteca</option>
        <option>Servicios (luz, agua, gas)</option>
        <option>Internet / Teléfono</option>
        <option>Suscripciones</option>
        <option>Seguro</option>
        <option>Comida y mercado</option>
        <option>Transporte</option>
        <option>Salud</option>
        <option>Ocio y entretenimiento</option>
        <option>Ropa</option>
        <option>Educación</option>
        <option>Restaurantes</option>
        <option>Otro</option>
      </select>
    </div>
    <button class="btn btn-amber" onclick="addGasto()">+ Agregar gasto</button>
  </div>
  <div id="gastos-fijos-wrap"></div>
  <div id="gastos-vars-wrap"></div>
</div>

<div id="screen-analisis" class="screen">
  <div id="analisis-wrap"></div>
</div>

<nav class="bottom-nav">
  <button class="bnav-btn active" onclick="showTab('resumen',this)">
    <i class="ti ti-home"></i>Resumen
  </button>
  <button class="bnav-btn" onclick="showTab('ingresos',this)">
    <i class="ti ti-cash"></i>Ingresos
  </button>
  <button class="bnav-btn" onclick="showTab('gastos',this)">
    <i class="ti ti-credit-card"></i>Gastos
  </button>
  <button class="bnav-btn" onclick="showTab('analisis',this)">
    <i class="ti ti-chart-bar"></i>Análisis
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
const mxn = v => '$' + Math.round(v).toLocaleString('es-MX');
const pct = (a,b) => b===0 ? 0 : Math.round(a/b*100);
const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
document.getElementById('mes-label').textContent = meses[new Date().getMonth()] + ' ' + new Date().getFullYear();

let data = {ingresos:[], gastos:[]};
try { const s = localStorage.getItem('balanza_v2'); if(s) data = JSON.parse(s); } catch(e){}

function save(){ try{ localStorage.setItem('balanza_v2', JSON.stringify(data)); }catch(e){} }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function showTab(name, btn){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  if(btn) btn.classList.add('active');
  render();
}

function addIngreso(){
  const desc = document.getElementById('ing-desc').value.trim();
  const monto = parseFloat(document.getElementById('ing-monto').value);
  const cat = document.getElementById('ing-cat').value;
  if(!desc){ toast('Escribe una descripción'); return; }
  if(!monto || monto<=0){ toast('Ingresa un monto válido'); return; }
  data.ingresos.unshift({id:Date.now(), desc, monto, cat, fecha: new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'short'})});
  save(); toast('Ingreso agregado ✓');
  document.getElementById('ing-desc').value='';
  document.getElementById('ing-monto').value='';
  render();
}

function addGasto(){
  const desc = document.getElementById('gasto-desc').value.trim();
  const monto = parseFloat(document.getElementById('gasto-monto').value);
  const tipo = document.getElementById('gasto-tipo').value;
  const cat = document.getElementById('gasto-cat').value;
  if(!desc){ toast('Escribe una descripción'); return; }
  if(!monto || monto<=0){ toast('Ingresa un monto válido'); return; }
  data.gastos.unshift({id:Date.now(), desc, monto, tipo, cat, fecha: new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'short'})});
  save(); toast('Gasto agregado ✓');
  document.getElementById('gasto-desc').value='';
  document.getElementById('gasto-monto').value='';
  render();
}

function delIngreso(id){ if(!confirm('¿Eliminar este ingreso?')) return; data.ingresos = data.ingresos.filter(i=>i.id!==id); save(); render(); }
function delGasto(id){ if(!confirm('¿Eliminar este gasto?')) return; data.gastos = data.gastos.filter(g=>g.id!==id); save(); render(); }

function entryHTML(item, tipo){
  const isIng = tipo==='ingreso';
  const color = isIng ? 'var(--green)' : (item.tipo==='fijo' ? 'var(--blue)' : 'var(--amber)');
  const bg = isIng ? 'var(--green-light)' : (item.tipo==='fijo' ? 'var(--blue-light)' : 'var(--amber-light)');
  const icon = isIng ? 'ti-cash' : (item.tipo==='fijo' ? 'ti-lock' : 'ti-arrows-shuffle');
  const sign = isIng ? '+' : '−';
  const fn = isIng ? `delIngreso(${item.id})` : `delGasto(${item.id})`;
  return `<div class="entry">
    <div class="entry-icon" style="background:${bg}"><i class="ti ${icon}" style="color:${color}"></i></div>
    <div class="entry-body">
      <div class="entry-name">${item.desc}</div>
      <div class="entry-meta">${item.cat} · ${item.fecha}</div>
    </div>
    <div class="entry-amount" style="color:${color}">${sign}${mxn(item.monto)}</div>
    <button class="entry-del" onclick="${fn}"><i class="ti ti-trash"></i></button>
  </div>`;
}

function render(){
  const totalIng = data.ingresos.reduce((a,i)=>a+i.monto,0);
  const fijos = data.gastos.filter(g=>g.tipo==='fijo');
  const vars = data.gastos.filter(g=>g.tipo==='variable');
  const totalFijos = fijos.reduce((a,g)=>a+g.monto,0);
  const totalVars = vars.reduce((a,g)=>a+g.monto,0);
  const totalGastos = totalFijos + totalVars;
  const balance = totalIng - totalGastos;

  // Hero
  const hc = document.getElementById('hero-card');
  hc.style.background = balance < 0 ? 'var(--amber)' : (balance===0 && totalIng===0 ? 'var(--blue)' : 'var(--blue)');
  if(balance < 0) hc.style.background = 'var(--amber)';
  else if(balance > 0) hc.style.background = 'var(--blue)';
  else hc.style.background = 'var(--gray)';
  document.getElementById('hero-amount').textContent = (balance>0?'+':'')+mxn(balance);
  document.getElementById('hero-sub').textContent = totalIng===0 ? 'Agrega tus ingresos para comenzar'
    : balance<0 ? 'Atención: gastas más de lo que ingresas'
    : balance===0 ? 'Sin margen de ahorro este mes'
    : 'Disponible para ahorrar o invertir';

  document.getElementById('m-ingresos').textContent = mxn(totalIng);
  document.getElementById('m-gastos').textContent = mxn(totalGastos);
  document.getElementById('m-fijos').textContent = mxn(totalFijos);
  document.getElementById('m-variables').textContent = mxn(totalVars);

  // Regla 50/30/20
  const rw = document.getElementById('regla-wrap');
  if(totalIng > 0){
    const pF = pct(totalFijos,totalIng), pV = pct(totalVars,totalIng);
    const pA = Math.max(0, 100-pF-pV);
    const aColor = pA>=20?'var(--green)':(pA>=10?'var(--amber)':'var(--red)');
    const alertBg = pA>=20?'var(--green-light)':(pA>=10?'var(--amber-light)':'var(--red-light)');
    const alertColor = pA>=20?'var(--green)':(pA>=10?'var(--amber)':'var(--red)');
    const alertIcon = pA>=20?'ti-circle-check':(pA>0?'ti-alert-triangle':'ti-alert-circle');
    const alertMsg = pA>=20?'¡Excelente! Estás ahorrando el 20% o más de tus ingresos.'
      : pA>0?`Ahorras ${pA}% de tus ingresos. La meta sugerida es 20%.`
      : 'Sin margen de ahorro. Tus gastos superan tus ingresos.';
    rw.innerHTML = `<div class="sec-lbl">Distribución del ingreso</div>
      <div class="rule-card"><div class="rule-pct" style="color:var(--blue)">${pF}%</div><div><div class="rule-title">Gastos fijos</div><div class="rule-sub">Sugerido: máximo 50%</div></div></div>
      <div class="rule-card"><div class="rule-pct" style="color:var(--amber)">${pV}%</div><div><div class="rule-title">Gastos variables</div><div class="rule-sub">Sugerido: máximo 30%</div></div></div>
      <div class="rule-card"><div class="rule-pct" style="color:${aColor}">${pA}%</div><div><div class="rule-title">Ahorro disponible</div><div class="rule-sub">Sugerido: mínimo 20%</div></div></div>
      <div class="alert" style="background:${alertBg};color:${alertColor}"><i class="ti ${alertIcon}"></i><span>${alertMsg}</span></div>`;
  } else rw.innerHTML='';

  // Últimos
  const todos = [...data.ingresos.map(i=>({...i,_t:'ingreso'})), ...data.gastos.map(g=>({...g,_t:'gasto'}))]
    .sort((a,b)=>b.id-a.id).slice(0,6);
  document.getElementById('ultimos-wrap').innerHTML = todos.length===0
    ? `<div class="empty"><i class="ti ti-receipt-off"></i>Aún no hay movimientos.<br>Comienza en la pestaña Ingresos.</div>`
    : `<div class="entry-list">${todos.map(i=>entryHTML(i,i._t)).join('')}</div>`;

  // Ingresos lista
  document.getElementById('ingresos-lista').innerHTML = data.ingresos.length===0
    ? `<div class="empty"><i class="ti ti-cash-off"></i>Sin ingresos este mes.</div>`
    : `<div class="entry-list">${data.ingresos.map(i=>entryHTML(i,'ingreso')).join('')}</div>`;

  // Gastos fijos
  document.getElementById('gastos-fijos-wrap').innerHTML = `<div class="sec-lbl">Gastos fijos</div>`
    + (fijos.length===0 ? `<div class="empty" style="padding:16px"><i class="ti ti-lock-off"></i>Sin gastos fijos.</div>`
    : `<div class="entry-list">${fijos.map(g=>entryHTML(g,'gasto')).join('')}</div>`);

  // Gastos variables
  document.getElementById('gastos-vars-wrap').innerHTML = `<div class="sec-lbl">Gastos variables</div>`
    + (vars.length===0 ? `<div class="empty" style="padding:16px"><i class="ti ti-arrows-shuffle"></i>Sin gastos variables.</div>`
    : `<div class="entry-list">${vars.map(g=>entryHTML(g,'gasto')).join('')}</div>`);

  // Análisis
  const aw = document.getElementById('analisis-wrap');
  if(totalIng===0 && totalGastos===0){
    aw.innerHTML=`<div class="empty" style="padding-top:60px"><i class="ti ti-chart-bar-off"></i>Registra ingresos y gastos<br>para ver tu análisis aquí.</div>`;
    return;
  }
  const cats = {};
  data.gastos.forEach(g=>{ if(!cats[g.cat]) cats[g.cat]={total:0,tipo:g.tipo}; cats[g.cat].total+=g.monto; });
  const catArr = Object.entries(cats).sort((a,b)=>b[1].total-a[1].total);
  const maxCat = catArr.length>0 ? catArr[0][1].total : 1;

  const barsHTML = catArr.slice(0,6).map(([cat,v])=>{
    const h = Math.max(4, Math.round(v.total/maxCat*80));
    const c = v.tipo==='fijo'?'var(--blue-mid)':'var(--amber-mid)';
    const short = cat.split(' ')[0].substring(0,8);
    return `<div class="bar-col"><div class="bar-rect" style="height:${h}px;background:${c}"></div><div class="bar-lbl">${short}</div></div>`;
  }).join('');

  aw.innerHTML = `
    <div class="hero-card" style="background:var(--purple);margin-top:12px">
      <div class="hero-label">Ingresos totales</div>
      <div class="hero-amount">${mxn(totalIng)}</div>
      <div class="hero-sub">Gastos: ${mxn(totalGastos)} · Disponible: ${mxn(Math.max(0,balance))}</div>
    </div>
    <div class="chart-wrap">
      <div class="sec-lbl" style="margin-top:0">Gastos por categoría</div>
      ${catArr.length===0?'<div class="empty">Sin gastos registrados.</div>':`<div class="bars">${barsHTML}</div><div class="legend"><div class="leg"><div class="leg-dot" style="background:var(--blue-mid)"></div>Fijo</div><div class="leg"><div class="leg-dot" style="background:var(--amber-mid)"></div>Variable</div></div>`}
    </div>
    <div class="sec-lbl">Detalle por categoría</div>
    ${catArr.map(([cat,v])=>{
      const p = pct(v.total, totalGastos);
      const c = v.tipo==='fijo'?'var(--blue-mid)':'var(--amber-mid)';
      const warn = p>40;
      return `<div class="budget-row">
        <div class="brow-head">
          <div class="brow-name">${cat}</div>
          <div class="brow-right">
            <div class="brow-pct" style="color:${warn?'var(--red)':c}">${p}%</div>
            <div class="brow-val">${mxn(v.total)}</div>
          </div>
        </div>
        <div class="prog-wrap"><div class="prog-fill" style="width:${p}%;background:${warn?'var(--red)':c}"></div></div>
        <div class="brow-sub">${v.tipo==='fijo'?'Gasto fijo':'Gasto variable'} · ${p}% del total de gastos</div>
      </div>`;
    }).join('')}`;
}

render();
</script>
</body>
</html>
