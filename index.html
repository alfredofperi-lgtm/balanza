<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Balanza">
<meta name="theme-color" content="#185FA5">
<title>Balanza — Presupuesto Personal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
:root{
  --blue:#185FA5;--blue-light:#E6F1FB;--blue-mid:#378ADD;
  --green:#0F6E56;--green-light:#E1F5EE;
  --amber:#854F0B;--amber-light:#FAEEDA;--amber-mid:#EF9F27;
  --red:#A32D2D;--red-light:#FCEBEB;
  --purple:#3C3489;
  --gray:#5F5E5A;
  --text:#1a1a1a;--text2:#6b6b6b;
  --bg:#f5f4f0;--surface:#ffffff;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.2);
  --r:12px;--rs:8px;
}
@media(prefers-color-scheme:dark){
  :root{
    --text:#f0ede8;--text2:#a0a09a;
    --bg:#1a1917;--surface:#242320;
    --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);
    --blue-light:#0c2d4a;--green-light:#062e22;--amber-light:#3a2005;
    --red-light:#3a1010;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:480px;margin:0 auto;padding-bottom:84px}
input,select,button{font-family:'DM Sans',sans-serif;font-size:16px}

.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:0.5px solid var(--border);display:flex;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:100}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;background:none;border:none;cursor:pointer;color:var(--text2);font-size:10px;font-weight:500;transition:color .15s}
.bnav-btn.active{color:var(--blue)}
.bnav-btn i{font-size:22px}

.screen{display:none;padding:0 16px;animation:fadeIn .15s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

.app-header{padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.app-logo{display:flex;align-items:center;gap:8px}
.app-logo-icon{width:34px;height:34px;background:var(--blue);border-radius:9px;display:flex;align-items:center;justify-content:center}
.app-logo-icon i{font-size:18px;color:#fff}
.app-title{font-size:20px;font-weight:500}

.periodo-bar{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 16px;background:var(--surface);border-bottom:0.5px solid var(--border);margin-bottom:2px}
.periodo-btn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:22px;padding:4px}
.periodo-label{font-size:15px;font-weight:500;color:var(--text);min-width:140px;text-align:center}

.hero-card{border-radius:var(--r);padding:18px;margin:10px 0;color:#fff}
.hero-label{font-size:12px;opacity:.8;margin-bottom:4px}
.hero-amount{font-size:34px;font-weight:500;letter-spacing:-1px;line-height:1}
.hero-sub{font-size:12px;opacity:.7;margin-top:6px}

.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.metric{background:var(--surface);border-radius:var(--rs);padding:12px;border:0.5px solid var(--border)}
.metric-lbl{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:4px;margin-bottom:3px}
.metric-lbl i{font-size:13px}
.metric-val{font-size:20px;font-weight:500}

.sec-lbl{font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 7px}

.entry-list{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.entry{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--rs);padding:11px 12px;display:flex;align-items:center;gap:9px}
.entry-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.entry-body{flex:1;min-width:0}
.entry-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-meta{font-size:11px;color:var(--text2);margin-top:1px}
.entry-amount{font-size:13px;font-weight:500;flex-shrink:0}
.entry-actions{display:flex;gap:2px;flex-shrink:0}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:17px;padding:4px;opacity:.6}
.icon-btn:active{opacity:1}
.badge-fijo{display:inline-block;font-size:9px;font-weight:500;background:var(--blue-light);color:var(--blue);border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:middle}

.add-form{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:4px}
.form-title{font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;color:var(--text2)}
.field input,.field select{background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--rs);padding:9px 11px;color:var(--text);font-size:15px;width:100%;outline:none;-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:var(--blue)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.field-row .field{margin:0}
.btn{width:100%;padding:12px;border:none;border-radius:var(--rs);font-size:15px;font-weight:500;cursor:pointer;color:#fff;transition:opacity .15s}
.btn:active{opacity:.85}
.btn-blue{background:var(--blue)}
.btn-green{background:var(--green)}
.btn-amber{background:var(--amber)}
.btn-red{background:var(--red)}

.rule-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--rs);padding:11px 13px;margin-bottom:6px;display:flex;gap:12px;align-items:center}
.rule-pct{font-size:22px;font-weight:500;width:50px;text-align:center;flex-shrink:0}
.rule-title{font-size:13px;font-weight:500}
.rule-sub{font-size:11px;color:var(--text2);margin-top:1px}

.alert{border-radius:var(--rs);padding:11px 13px;margin-bottom:10px;font-size:13px;line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.alert i{font-size:16px;flex-shrink:0;margin-top:1px}

.budget-row{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--rs);padding:11px 13px;margin-bottom:6px}
.brow-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.brow-name{font-size:13px;font-weight:500}
.brow-right{display:flex;align-items:center;gap:8px}
.prog-wrap{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin-bottom:3px}
.prog-fill{height:5px;border-radius:3px}
.brow-sub{font-size:11px;color:var(--text2)}

.chart-wrap{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.bars{display:flex;align-items:flex-end;gap:6px;height:80px;margin-bottom:7px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.bar-rect{width:100%;border-radius:3px 3px 0 0;min-height:3px}
.bar-lbl{font-size:10px;color:var(--text2);text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;gap:14px}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.leg-dot{width:8px;height:8px;border-radius:50%}

.empty{text-align:center;padding:28px 16px;color:var(--text2);font-size:14px;line-height:1.6}
.empty i{font-size:34px;opacity:.3;display:block;margin-bottom:7px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-bg.hidden{display:none}
.modal{background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding:20px 16px max(20px,env(safe-area-inset-bottom));width:100%;max-width:480px;animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-size:16px;font-weight:500;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text2);font-size:22px;padding:2px}
.modal-sep{height:0.5px;background:var(--border);margin:12px 0}
.modal-opt{width:100%;padding:13px;border:0.5px solid var(--border);border-radius:var(--rs);background:var(--surface);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.modal-opt i{font-size:18px}
.modal-opt:active{opacity:.8}

.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="app-header">
  <div class="app-logo">
    <div class="app-logo-icon"><i class="ti ti-chart-pie"></i></div>
    <span class="app-title">Balanza</span>
  </div>
</div>

<div class="periodo-bar">
  <button class="periodo-btn" onclick="cambiarPeriodo(-1)"><i class="ti ti-chevron-left"></i></button>
  <div class="periodo-label" id="periodo-label"></div>
  <button class="periodo-btn" onclick="cambiarPeriodo(1)"><i class="ti ti-chevron-right"></i></button>
</div>

<!-- RESUMEN -->
<div id="screen-resumen" class="screen active">
  <div class="hero-card" id="hero-card">
    <div class="hero-label">Balance del mes</div>
    <div class="hero-amount" id="hero-amount">$0</div>
    <div class="hero-sub" id="hero-sub">Agrega tus ingresos para comenzar</div>
  </div>
  <div class="metrics">
    <div class="metric">
      <div class="metric-lbl" style="color:var(--green)"><i class="ti ti-cash"></i> Ingresos</div>
      <div class="metric-val" style="color:var(--green)" id="m-ingresos">$0</div>
    </div>
    <div class="metric">
      <div class="metric-lbl" style="color:var(--red)"><i class="ti ti-credit-card"></i> Gastos</div>
      <div class="metric-val" style="color:var(--red)" id="m-gastos">$0</div>
    </div>
    <div class="metric">
      <div class="metric-lbl"><i class="ti ti-lock"></i> Fijos</div>
      <div class="metric-val" id="m-fijos">$0</div>
    </div>
    <div class="metric">
      <div class="metric-lbl"><i class="ti ti-arrows-shuffle"></i> Variables</div>
      <div class="metric-val" id="m-variables">$0</div>
    </div>
  </div>
  <div id="regla-wrap"></div>
  <div class="sec-lbl">Últimos movimientos</div>
  <div id="ultimos-wrap"></div>
</div>

<!-- INGRESOS -->
<div id="screen-ingresos" class="screen">
  <div class="add-form" style="margin-top:10px">
    <div class="form-title">Nuevo ingreso</div>
    <div class="field">
      <label>Descripción</label>
      <input type="text" id="ing-desc" placeholder="Ej. Sueldo, Freelance...">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Monto (MXN)</label>
        <input type="number" id="ing-monto" placeholder="0" min="0" inputmode="decimal">
      </div>
      <div class="field">
        <label>Fecha</label>
        <input type="date" id="ing-fecha">
      </div>
    </div>
    <div class="field">
      <label>Categoría</label>
      <select id="ing-cat" onchange="checkCustom('ing-cat','ing-cat-custom-wrap')">
        <option>Sueldo</option><option>Freelance</option><option>Renta cobrada</option><option>Bono</option><option>Negocio</option>
        <option value="__custom__">+ Agregar categoría...</option>
      </select>
    </div>
    <div class="field" id="ing-cat-custom-wrap" style="display:none">
      <label>Nueva categoría</label>
      <input type="text" id="ing-cat-custom" placeholder="Escribe el nombre...">
    </div>
    <button class="btn btn-green" onclick="addIngreso()">+ Agregar ingreso</button>
  </div>
  <div class="sec-lbl">Ingresos del mes</div>
  <div id="ingresos-lista"></div>
</div>

<!-- GASTOS -->
<div id="screen-gastos" class="screen">
  <div class="add-form" style="margin-top:10px">
    <div class="form-title">Nuevo gasto</div>
    <div class="field">
      <label>Descripción</label>
      <input type="text" id="gasto-desc" placeholder="Ej. Renta, Súper, Uber...">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Monto (MXN)</label>
        <input type="number" id="gasto-monto" placeholder="0" min="0" inputmode="decimal">
      </div>
      <div class="field">
        <label>Tipo</label>
        <select id="gasto-tipo" onchange="toggleFechaGasto()">
          <option value="fijo">Fijo (recurrente)</option>
          <option value="variable">Variable (este mes)</option>
        </select>
      </div>
    </div>
    <div class="field" id="gasto-fecha-wrap" style="display:none">
      <label>Fecha</label>
      <input type="date" id="gasto-fecha">
    </div>
    <div class="field">
      <label>Categoría</label>
      <select id="gasto-cat" onchange="checkCustom('gasto-cat','gasto-cat-custom-wrap')">
        <option>Renta / Hipoteca</option><option>Servicios</option><option>Internet / Teléfono</option>
        <option>Suscripciones</option><option>Seguro</option><option>Comida y mercado</option>
        <option>Transporte</option><option>Salud</option><option>Ocio</option>
        <option>Ropa</option><option>Educación</option><option>Restaurantes</option>
        <option value="__custom__">+ Agregar categoría...</option>
      </select>
    </div>
    <div class="field" id="gasto-cat-custom-wrap" style="display:none">
      <label>Nueva categoría</label>
      <input type="text" id="gasto-cat-custom" placeholder="Escribe el nombre...">
    </div>
    <button class="btn btn-amber" onclick="addGasto()">+ Agregar gasto</button>
  </div>
  <div id="gastos-fijos-wrap"></div>
  <div id="gastos-vars-wrap"></div>
</div>

<!-- ANÁLISIS -->
<div id="screen-analisis" class="screen">
  <div id="analisis-wrap"></div>
</div>

<nav class="bottom-nav">
  <button class="bnav-btn active" onclick="showTab('resumen',this)"><i class="ti ti-home"></i>Resumen</button>
  <button class="bnav-btn" onclick="showTab('ingresos',this)"><i class="ti ti-cash"></i>Ingresos</button>
  <button class="bnav-btn" onclick="showTab('gastos',this)"><i class="ti ti-credit-card"></i>Gastos</button>
  <button class="bnav-btn" onclick="showTab('analisis',this)"><i class="ti ti-chart-bar"></i>Análisis</button>
</nav>

<!-- MODAL EDITAR -->
<div class="modal-bg hidden" id="modal-edit-bg">
  <div class="modal">
    <div class="modal-title">
      <span id="modal-edit-title">Editar</span>
      <button class="modal-close" onclick="closeModal('modal-edit-bg')"><i class="ti ti-x"></i></button>
    </div>
    <div class="field"><label>Descripción</label><input type="text" id="edit-desc"></div>
    <div class="field-row">
      <div class="field"><label>Monto (MXN)</label><input type="number" id="edit-monto" min="0" inputmode="decimal"></div>
      <div class="field" id="edit-fecha-wrap"><label>Fecha</label><input type="date" id="edit-fecha"></div>
    </div>
    <div class="field" id="edit-cat-wrap"><label>Categoría</label><select id="edit-cat" onchange="checkCustom('edit-cat','edit-cat-custom-wrap')"></select></div>
    <div class="field" id="edit-cat-custom-wrap" style="display:none"><label>Nueva categoría</label><input type="text" id="edit-cat-custom" placeholder="Escribe el nombre..."></div>
    <div class="field" id="edit-tipo-wrap" style="display:none"><label>Tipo</label><select id="edit-tipo"><option value="fijo">Fijo (recurrente)</option><option value="variable">Variable (este mes)</option></select></div>
    <button class="btn btn-blue" onclick="saveEdit()" style="margin-top:4px">Guardar cambios</button>
  </div>
</div>

<!-- MODAL ELIMINAR FIJO -->
<div class="modal-bg hidden" id="modal-del-bg">
  <div class="modal">
    <div class="modal-title">
      <span>Eliminar gasto fijo</span>
      <button class="modal-close" onclick="closeModal('modal-del-bg')"><i class="ti ti-x"></i></button>
    </div>
    <p style="font-size:14px;color:var(--text2);margin-bottom:14px;line-height:1.5">Este es un gasto recurrente. ¿Qué deseas hacer?</p>
    <button class="modal-opt" onclick="delFijoEstesMes()" style="color:var(--amber)">
      <i class="ti ti-calendar-x" style="color:var(--amber)"></i>
      Eliminar solo este mes
    </button>
    <button class="modal-opt" onclick="delFijoSerie()" style="color:var(--red)">
      <i class="ti ti-trash" style="color:var(--red)"></i>
      Eliminar toda la serie
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const mxn = v => '$' + Math.round(v).toLocaleString('es-MX');
const pct = (a,b) => b===0?0:Math.round(a/b*100);
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

let now = new Date();
let periodoMes = now.getMonth();
let periodoAnio = now.getFullYear();

// DATA STRUCTURE
// ingresos: [{id, desc, monto, cat, fecha}]  — manuales por mes
// gastos variables: [{id, desc, monto, cat, tipo:'variable', fecha}]
// gastos fijos: [{id, desc, monto, cat, tipo:'fijo', desde:'YYYY-MM', excluidos:['YYYY-MM',...]}]
let data = {
  ingresos: [],
  gastos: [],
  catIngresos: ['Sueldo','Freelance','Renta cobrada','Bono','Negocio'],
  catGastos: ['Renta / Hipoteca','Servicios','Internet / Teléfono','Suscripciones','Seguro','Comida y mercado','Transporte','Salud','Ocio','Ropa','Educación','Restaurantes']
};

// Migrate old data from v3
try{
  const old = localStorage.getItem('balanza_v3');
  if(old){
    const d = JSON.parse(old);
    // migrate ingresos
    if(d.ingresos) data.ingresos = d.ingresos;
    // migrate gastos — fijos get 'desde' from their fecha or current period
    if(d.gastos) d.gastos.forEach(g=>{
      if(g.tipo==='fijo'){
        let desde = '2020-01'; // default: recur from beginning
        if(g.fecha){ const dt=new Date(g.fecha+'T12:00:00'); desde=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); }
        data.gastos.push({...g, desde, excluidos:[]});
      } else {
        data.gastos.push(g);
      }
    });
    if(d.catIngresos) data.catIngresos = d.catIngresos;
    if(d.catGastos) data.catGastos = d.catGastos;
  }
} catch(e){}

// Load v4
try{ const s=localStorage.getItem('balanza_v4'); if(s){ data=JSON.parse(s); } }catch(e){}
if(!data.catIngresos) data.catIngresos=['Sueldo','Freelance','Renta cobrada','Bono','Negocio'];
if(!data.catGastos) data.catGastos=['Renta / Hipoteca','Servicios','Internet / Teléfono','Suscripciones','Seguro','Comida y mercado','Transporte','Salud','Ocio','Ropa','Educación','Restaurantes'];
data.gastos.forEach(g=>{ if(g.tipo==='fijo'&&!g.excluidos) g.excluidos=[]; });

function save(){ try{ localStorage.setItem('balanza_v4', JSON.stringify(data)); }catch(e){} }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

function periodoKey(m,a){ return a+'-'+String(m+1).padStart(2,'0'); }
function curKey(){ return periodoKey(periodoMes,periodoAnio); }

function updatePeriodoLabel(){ document.getElementById('periodo-label').textContent=MESES[periodoMes]+' '+periodoAnio; }
function cambiarPeriodo(dir){
  periodoMes+=dir;
  if(periodoMes>11){periodoMes=0;periodoAnio++;}
  if(periodoMes<0){periodoMes=11;periodoAnio--;}
  updatePeriodoLabel(); render();
}
updatePeriodoLabel();

function enPeriodo(item){
  if(item.tipo==='fijo'){
    const key=curKey();
    // check desde
    if(item.desde && item.desde > key) return false;
    // check excluidos
    if(item.excluidos && item.excluidos.includes(key)) return false;
    return true;
  }
  if(!item.fecha) return true;
  const d=new Date(item.fecha+'T12:00:00');
  return d.getMonth()===periodoMes && d.getFullYear()===periodoAnio;
}

function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
document.getElementById('ing-fecha').value=todayStr();
document.getElementById('gasto-fecha').value=todayStr();

function toggleFechaGasto(){
  const tipo=document.getElementById('gasto-tipo').value;
  document.getElementById('gasto-fecha-wrap').style.display=tipo==='variable'?'flex':'none';
}

function showTab(name,btn){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  if(btn) btn.classList.add('active');
  render();
}

function checkCustom(selId, wrapId){
  document.getElementById(wrapId).style.display=document.getElementById(selId).value==='__custom__'?'flex':'none';
}

function buildCatSelect(sel, cats, selected){
  sel.innerHTML=cats.map(c=>`<option${c===selected?' selected':''}>${c}</option>`).join('')+'<option value="__custom__">+ Agregar categoría...</option>';
}

function resolvecat(selId, customId, catArr){
  const val=document.getElementById(selId).value;
  if(val==='__custom__'){
    const custom=document.getElementById(customId).value.trim();
    if(!custom){ toast('Escribe el nombre de la categoría'); return null; }
    if(!catArr.includes(custom)) catArr.push(custom);
    save(); return custom;
  }
  return val;
}

function addIngreso(){
  const desc=document.getElementById('ing-desc').value.trim();
  const monto=parseFloat(document.getElementById('ing-monto').value);
  const fecha=document.getElementById('ing-fecha').value;
  if(!desc){ toast('Escribe una descripción'); return; }
  if(!monto||monto<=0){ toast('Ingresa un monto válido'); return; }
  const cat=resolvecat('ing-cat','ing-cat-custom',data.catIngresos);
  if(!cat) return;
  data.ingresos.unshift({id:Date.now(),desc,monto,cat,fecha});
  save(); toast('Ingreso agregado ✓');
  document.getElementById('ing-desc').value='';
  document.getElementById('ing-monto').value='';
  document.getElementById('ing-fecha').value=todayStr();
  document.getElementById('ing-cat-custom-wrap').style.display='none';
  rebuildCats('ing-cat',data.catIngresos);
  render();
}

function addGasto(){
  const desc=document.getElementById('gasto-desc').value.trim();
  const monto=parseFloat(document.getElementById('gasto-monto').value);
  const tipo=document.getElementById('gasto-tipo').value;
  const fecha=document.getElementById('gasto-fecha').value;
  if(!desc){ toast('Escribe una descripción'); return; }
  if(!monto||monto<=0){ toast('Ingresa un monto válido'); return; }
  const cat=resolvecat('gasto-cat','gasto-cat-custom',data.catGastos);
  if(!cat) return;
  if(tipo==='fijo'){
    const desde=curKey();
    data.gastos.unshift({id:Date.now(),desc,monto,cat,tipo:'fijo',desde,excluidos:[]});
  } else {
    data.gastos.unshift({id:Date.now(),desc,monto,cat,tipo:'variable',fecha:fecha||todayStr()});
  }
  save(); toast('Gasto agregado ✓');
  document.getElementById('gasto-desc').value='';
  document.getElementById('gasto-monto').value='';
  document.getElementById('gasto-fecha').value=todayStr();
  document.getElementById('gasto-cat-custom-wrap').style.display='none';
  rebuildCats('gasto-cat',data.catGastos);
  render();
}

function rebuildCats(selId, cats){
  const sel=document.getElementById(selId);
  const cur=sel.value==='__custom__'?cats[0]:sel.value;
  buildCatSelect(sel,cats,cur);
}
rebuildCats('ing-cat',data.catIngresos);
rebuildCats('gasto-cat',data.catGastos);

function delIngreso(id){ if(!confirm('¿Eliminar este ingreso?')) return; data.ingresos=data.ingresos.filter(i=>i.id!==id); save(); render(); }
function delVariable(id){ if(!confirm('¿Eliminar este gasto?')) return; data.gastos=data.gastos.filter(g=>g.id!==id); save(); render(); }

// Delete fijo logic
let pendingDelId=null;
function delFijo(id){ pendingDelId=id; document.getElementById('modal-del-bg').classList.remove('hidden'); }
function delFijoEstesMes(){
  const g=data.gastos.find(g=>g.id===pendingDelId);
  if(g){ if(!g.excluidos) g.excluidos=[]; g.excluidos.push(curKey()); }
  save(); toast('Eliminado este mes ✓'); closeModal('modal-del-bg'); pendingDelId=null; render();
}
function delFijoSerie(){
  if(!confirm('¿Eliminar este gasto fijo permanentemente de todos los meses?')) return;
  data.gastos=data.gastos.filter(g=>g.id!==pendingDelId);
  save(); toast('Serie eliminada ✓'); closeModal('modal-del-bg'); pendingDelId=null; render();
}

// EDIT MODAL
let editId=null, editType=null;
function openEdit(id, tipo){
  editId=id; editType=tipo;
  const item=tipo==='ingreso'?data.ingresos.find(i=>i.id===id):data.gastos.find(g=>g.id===id);
  if(!item) return;
  document.getElementById('modal-edit-title').textContent=tipo==='ingreso'?'Editar ingreso':'Editar gasto';
  document.getElementById('edit-desc').value=item.desc;
  document.getElementById('edit-monto').value=item.monto;
  document.getElementById('edit-fecha').value=item.fecha||todayStr();
  // hide fecha for fijos
  document.getElementById('edit-fecha-wrap').style.display=item.tipo==='fijo'?'none':'flex';
  const cats=tipo==='ingreso'?data.catIngresos:data.catGastos;
  buildCatSelect(document.getElementById('edit-cat'),cats,item.cat);
  document.getElementById('edit-cat-custom-wrap').style.display='none';
  document.getElementById('edit-tipo-wrap').style.display=tipo==='gasto'?'block':'none';
  if(tipo==='gasto') document.getElementById('edit-tipo').value=item.tipo;
  document.getElementById('modal-edit-bg').classList.remove('hidden');
}

function closeModal(id){ document.getElementById(id).classList.add('hidden'); editId=null; editType=null; }

function saveEdit(){
  const desc=document.getElementById('edit-desc').value.trim();
  const monto=parseFloat(document.getElementById('edit-monto').value);
  const fecha=document.getElementById('edit-fecha').value;
  if(!desc){ toast('Escribe una descripción'); return; }
  if(!monto||monto<=0){ toast('Ingresa un monto válido'); return; }
  const cats=editType==='ingreso'?data.catIngresos:data.catGastos;
  const catSel=document.getElementById('edit-cat').value;
  let cat=catSel;
  if(catSel==='__custom__'){
    const custom=document.getElementById('edit-cat-custom').value.trim();
    if(!custom){ toast('Escribe el nombre de la categoría'); return; }
    if(!cats.includes(custom)) cats.push(custom);
    cat=custom;
  }
  if(editType==='ingreso'){
    const item=data.ingresos.find(i=>i.id===editId);
    if(item){item.desc=desc;item.monto=monto;item.cat=cat;item.fecha=fecha;}
  } else {
    const item=data.gastos.find(g=>g.id===editId);
    if(item){
      item.desc=desc;item.monto=monto;item.cat=cat;
      const nuevoTipo=document.getElementById('edit-tipo').value;
      if(item.tipo==='fijo'&&nuevoTipo==='variable'){ item.tipo='variable'; item.fecha=todayStr(); delete item.desde; delete item.excluidos; }
      else if(item.tipo==='variable'&&nuevoTipo==='fijo'){ item.tipo='fijo'; item.desde=curKey(); item.excluidos=[]; delete item.fecha; }
      else if(item.tipo==='variable'){ item.fecha=fecha; }
    }
  }
  save(); toast('Guardado ✓'); closeModal('modal-edit-bg'); render();
}

document.getElementById('modal-edit-bg').addEventListener('click',function(e){if(e.target===this)closeModal('modal-edit-bg');});
document.getElementById('modal-del-bg').addEventListener('click',function(e){if(e.target===this)closeModal('modal-del-bg');});

function fmtFecha(f){
  if(!f) return '';
  const d=new Date(f+'T12:00:00');
  return d.getDate()+' '+MESES[d.getMonth()].substring(0,3);
}

function entryHTML(item, tipo){
  const isIng=tipo==='ingreso';
  const isFijo=item.tipo==='fijo';
  const color=isIng?'var(--green)':(isFijo?'var(--blue)':'var(--amber)');
  const bg=isIng?'var(--green-light)':(isFijo?'var(--blue-light)':'var(--amber-light)');
  const icon=isIng?'ti-cash':(isFijo?'ti-lock':'ti-arrows-shuffle');
  const sign=isIng?'+':'−';
  const editFn=`openEdit(${item.id},'${tipo}')`;
  const delFn=isIng?`delIngreso(${item.id})`:isFijo?`delFijo(${item.id})`:`delVariable(${item.id})`;
  const fecha=item.fecha?fmtFecha(item.fecha):'';
  const badge=isFijo?'<span class="badge-fijo">recurrente</span>':'';
  return `<div class="entry">
    <div class="entry-icon" style="background:${bg}"><i class="ti ${icon}" style="color:${color}"></i></div>
    <div class="entry-body">
      <div class="entry-name">${item.desc}${badge}</div>
      <div class="entry-meta">${item.cat}${fecha?' · '+fecha:''}</div>
    </div>
    <div class="entry-amount" style="color:${color}">${sign}${mxn(item.monto)}</div>
    <div class="entry-actions">
      <button class="icon-btn" onclick="${editFn}" aria-label="Editar"><i class="ti ti-edit"></i></button>
      <button class="icon-btn" onclick="${delFn}" aria-label="Eliminar"><i class="ti ti-trash"></i></button>
    </div>
  </div>`;
}

function render(){
  const ingresosMes=data.ingresos.filter(enPeriodo);
  const gastosMes=data.gastos.filter(enPeriodo);
  const fijos=gastosMes.filter(g=>g.tipo==='fijo');
  const vars=gastosMes.filter(g=>g.tipo==='variable');
  const totalIng=ingresosMes.reduce((a,i)=>a+i.monto,0);
  const totalFijos=fijos.reduce((a,g)=>a+g.monto,0);
  const totalVars=vars.reduce((a,g)=>a+g.monto,0);
  const totalGastos=totalFijos+totalVars;
  const balance=totalIng-totalGastos;

  const hc=document.getElementById('hero-card');
  hc.style.background=balance<0?'var(--amber)':(totalIng===0?'var(--gray)':'var(--blue)');
  document.getElementById('hero-amount').textContent=(balance>0?'+':'')+mxn(balance);
  document.getElementById('hero-sub').textContent=totalIng===0?'Agrega tus ingresos para comenzar':balance<0?'Atención: gastas más de lo que ingresas':balance===0?'Sin margen de ahorro este mes':'Disponible para ahorrar o invertir';
  document.getElementById('m-ingresos').textContent=mxn(totalIng);
  document.getElementById('m-gastos').textContent=mxn(totalGastos);
  document.getElementById('m-fijos').textContent=mxn(totalFijos);
  document.getElementById('m-variables').textContent=mxn(totalVars);

  const rw=document.getElementById('regla-wrap');
  if(totalIng>0){
    const pF=pct(totalFijos,totalIng),pV=pct(totalVars,totalIng),pA=Math.max(0,100-pF-pV);
    const aC=pA>=20?'var(--green)':(pA>=10?'var(--amber)':'var(--red)');
    const aBg=pA>=20?'var(--green-light)':(pA>=10?'var(--amber-light)':'var(--red-light)');
    const aColor=pA>=20?'var(--green)':(pA>=10?'var(--amber)':'var(--red)');
    const aIcon=pA>=20?'ti-circle-check':(pA>0?'ti-alert-triangle':'ti-alert-circle');
    const aMsg=pA>=20?'¡Excelente! Estás ahorrando el 20% o más.':pA>0?`Ahorras ${pA}%. La meta sugerida es 20%.`:'Sin margen de ahorro. Revisa tus gastos.';
    rw.innerHTML=`<div class="sec-lbl">Distribución del ingreso</div>
      <div class="rule-card"><div class="rule-pct" style="color:var(--blue)">${pF}%</div><div><div class="rule-title">Gastos fijos</div><div class="rule-sub">Sugerido: máximo 50%</div></div></div>
      <div class="rule-card"><div class="rule-pct" style="color:var(--amber)">${pV}%</div><div><div class="rule-title">Gastos variables</div><div class="rule-sub">Sugerido: máximo 30%</div></div></div>
      <div class="rule-card"><div class="rule-pct" style="color:${aC}">${pA}%</div><div><div class="rule-title">Ahorro disponible</div><div class="rule-sub">Sugerido: mínimo 20%</div></div></div>
      <div class="alert" style="background:${aBg};color:${aColor}"><i class="ti ${aIcon}"></i><span>${aMsg}</span></div>`;
  } else rw.innerHTML='';

  const todos=[...ingresosMes.map(i=>({...i,_t:'ingreso'})),...gastosMes.map(g=>({...g,_t:'gasto'}))]
    .sort((a,b)=>b.id-a.id).slice(0,6);
  document.getElementById('ultimos-wrap').innerHTML=todos.length===0
    ?`<div class="empty"><i class="ti ti-receipt-off"></i>Sin movimientos este mes.<br>Comienza en la pestaña Ingresos.</div>`
    :`<div class="entry-list">${todos.map(i=>entryHTML(i,i._t)).join('')}</div>`;

  document.getElementById('ingresos-lista').innerHTML=ingresosMes.length===0
    ?`<div class="empty"><i class="ti ti-cash-off"></i>Sin ingresos este mes.</div>`
    :`<div class="entry-list">${ingresosMes.map(i=>entryHTML(i,'ingreso')).join('')}</div>`;

  document.getElementById('gastos-fijos-wrap').innerHTML=`<div class="sec-lbl">Gastos fijos — recurrentes</div>`
    +(fijos.length===0?`<div class="empty" style="padding:16px 0"><i class="ti ti-lock-off"></i>Sin gastos fijos activos este mes.</div>`
    :`<div class="entry-list">${fijos.map(g=>entryHTML(g,'gasto')).join('')}</div>`);

  document.getElementById('gastos-vars-wrap').innerHTML=`<div class="sec-lbl">Gastos variables — este mes</div>`
    +(vars.length===0?`<div class="empty" style="padding:16px 0"><i class="ti ti-arrows-shuffle"></i>Sin gastos variables este mes.</div>`
    :`<div class="entry-list">${vars.map(g=>entryHTML(g,'gasto')).join('')}</div>`);

  const aw=document.getElementById('analisis-wrap');
  if(totalIng===0&&totalGastos===0){
    aw.innerHTML=`<div class="empty" style="padding-top:50px"><i class="ti ti-chart-bar-off"></i>Registra ingresos y gastos<br>para ver tu análisis aquí.</div>`;
    return;
  }
  const cats={};
  gastosMes.forEach(g=>{ if(!cats[g.cat]) cats[g.cat]={total:0,tipo:g.tipo}; cats[g.cat].total+=g.monto; });
  const catArr=Object.entries(cats).sort((a,b)=>b[1].total-a[1].total);
  const maxCat=catArr.length>0?catArr[0][1].total:1;
  const barsHTML=catArr.slice(0,6).map(([cat,v])=>{
    const h=Math.max(4,Math.round(v.total/maxCat*72));
    const c=v.tipo==='fijo'?'var(--blue-mid)':'var(--amber-mid)';
    return `<div class="bar-col"><div class="bar-rect" style="height:${h}px;background:${c}"></div><div class="bar-lbl">${cat.split(' ')[0].substring(0,8)}</div></div>`;
  }).join('');
  aw.innerHTML=`
    <div class="hero-card" style="background:var(--purple);margin-top:10px">
      <div class="hero-label">Ingresos ${MESES[periodoMes]}</div>
      <div class="hero-amount">${mxn(totalIng)}</div>
      <div class="hero-sub">Gastos: ${mxn(totalGastos)} · Disponible: ${mxn(Math.max(0,balance))}</div>
    </div>
    <div class="chart-wrap">
      <div class="sec-lbl" style="margin-top:0">Gastos por categoría</div>
      ${catArr.length===0?'<div class="empty">Sin gastos registrados.</div>':`<div class="bars">${barsHTML}</div><div class="legend"><div class="leg"><div class="leg-dot" style="background:var(--blue-mid)"></div>Fijo</div><div class="leg"><div class="leg-dot" style="background:var(--amber-mid)"></div>Variable</div></div>`}
    </div>
    <div class="sec-lbl">Detalle por categoría</div>
    ${catArr.map(([cat,v])=>{
      const p=pct(v.total,totalGastos);
      const c=v.tipo==='fijo'?'var(--blue-mid)':'var(--amber-mid)';
      const warn=p>40;
      return `<div class="budget-row">
        <div class="brow-head"><div class="brow-name">${cat}</div><div class="brow-right"><span style="font-size:12px;font-weight:500;color:${warn?'var(--red)':c}">${p}%</span><span style="font-size:13px;font-weight:500">${mxn(v.total)}</span></div></div>
        <div class="prog-wrap"><div class="prog-fill" style="width:${p}%;background:${warn?'var(--red)':c}"></div></div>
        <div class="brow-sub">${v.tipo==='fijo'?'Gasto fijo recurrente':'Gasto variable'} · ${p}% del total</div>
      </div>`;
    }).join('')}`;
}

render();
</script>
</body>
</html>
